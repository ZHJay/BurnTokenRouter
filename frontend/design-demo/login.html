<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · Sub2API</title>
<link rel="stylesheet" href="apple-theme.css" />
<script src="apple-theme.js"></script>
<style>
  /* =========================================================
     登录页 · 页面级布局（组件样式全部来自 apple-theme.css）
     ========================================================= */

  .login-wrap {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 20px 40px;
  }

  .login-card {
    width: 400px;
    max-width: 100%;
    padding: 42px 36px 34px;
  }

  /* 品牌区 */
  .brand { text-align: center; }
  .brand h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text-primary);
  }
  .brand p {
    margin-top: 7px;
    font-size: 14px;
    color: var(--text-secondary);
  }

  .login-form { margin-top: 30px; }

  /* 记住我 / 忘记密码 行 */
  .login-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -4px 0 20px;
  }
  .remember {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .remember:hover { color: var(--text-primary); }
  .remember:hover .checkbox { border-color: var(--blue); }
  .forgot { font-size: 13.5px; font-weight: 500; }

  /* 分割线 */
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 24px 0 20px;
    color: var(--text-tertiary);
    font-size: 12.5px;
  }
  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 0.5px;
    background: var(--separator);
  }

  /* 第三方登录 2x2 网格，第五个占满整行 */
  .social-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .social-btn {
    height: 42px;
    font-size: 13.5px;
  }
  .social-btn svg { width: 17px; height: 17px; flex-shrink: 0; }
  .social-btn.wide { grid-column: 1 / -1; }

  .register-hint {
    margin-top: 24px;
    text-align: center;
    font-size: 13.5px;
    color: var(--text-secondary);
  }
  .register-hint a { font-weight: 500; }

  /* 右上角主题切换 */
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 60;
  }

  /* =========================================================
     ambient 光斑（叠加在基座 body::before 之上，缓慢漂移）
     ========================================================= */
  .spot {
    position: fixed;
    z-index: -1;
    border-radius: 50%;
    pointer-events: none;
    will-change: transform;
  }
  .spot-1 {
    width: 420px;
    height: 420px;
    top: -140px;
    left: -120px;
    background: var(--blue);
    opacity: 0.13;
    filter: blur(90px);
    animation: drift1 26s var(--ease) infinite alternate;
  }
  .spot-2 {
    width: 380px;
    height: 380px;
    top: 10%;
    right: -140px;
    background: var(--purple);
    opacity: 0.11;
    filter: blur(90px);
    animation: drift2 30s var(--ease) infinite alternate;
  }
  .spot-3 {
    width: 460px;
    height: 460px;
    bottom: -180px;
    left: 20%;
    background: var(--teal);
    opacity: 0.1;
    filter: blur(100px);
    animation: drift3 34s var(--ease) infinite alternate;
  }
  html.dark .spot-1 { opacity: 0.22; }
  html.dark .spot-2 { opacity: 0.18; }
  html.dark .spot-3 { opacity: 0.16; }

  @keyframes drift1 {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(90px, 70px, 0) scale(1.15); }
  }
  @keyframes drift2 {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(-80px, 60px, 0) scale(1.1); }
  }
  @keyframes drift3 {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(-70px, -50px, 0) scale(1.12); }
  }

  /* 移动端适配（375px） */
  @media (max-width: 560px) {
    .login-wrap { padding: 48px 16px 32px; }
    .login-card { padding: 32px 24px 28px; }
    .spot-1 { width: 320px; height: 320px; top: -120px; left: -110px; }
    .spot-2 { width: 280px; height: 280px; top: 18%; right: -110px; }
    .spot-3 { width: 340px; height: 340px; bottom: -150px; left: 10%; }
  }
</style>
</head>
<body data-nav="none">

  <!-- ambient 漂移光斑 -->
  <div class="spot spot-1" aria-hidden="true"></div>
  <div class="spot spot-2" aria-hidden="true"></div>
  <div class="spot spot-3" aria-hidden="true"></div>

  <!-- 主题切换（固定右上角） -->
  <button class="icon-btn theme-toggle fade-up fade-up-1" id="themeToggle" aria-label="切换明暗模式"></button>

  <main class="login-wrap">
    <section class="glass-card login-card fade-up">
      <div class="brand">
        <h1>Sub2API</h1>
        <p>登录以管理你的 API 订阅</p>
      </div>

      <form class="login-form" id="loginForm" novalidate>
        <div class="field">
          <label for="email">邮箱</label>
          <input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
        </div>

        <div class="login-row">
          <button class="remember" id="rememberBtn" type="button">
            <span class="checkbox" id="rememberBox" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
            记住我
          </button>
          <a class="forgot" href="#">忘记密码？</a>
        </div>

        <button class="btn btn-primary btn-block" type="submit">登 录</button>
      </form>

      <div class="divider">或继续使用</div>

      <div class="social-grid">
        <button class="btn btn-secondary social-btn" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.35 11.1H12v2.9h5.35a6 6 0 0 1-2.6 3.9v3.2h4.2c2.5-2.3 3.9-5.7 3.9-9.7 0-.8-.1-1.6-.25-2.3Z"/><path d="M12 21.5c3.4 0 6.3-1.1 8.4-3l-4.2-3.2c-1.2.8-2.7 1.2-4.2 1.2a7.4 7.4 0 0 1-7-5l-4.3 3.3a12 12 0 0 0 11.3 6.7Z"/><path d="M5 12c0-.9.16-1.8.43-2.6L1.1 6.1A12 12 0 0 0 1 12c0 1.9.4 3.7 1.1 5.3l4.3-3.3A7.4 7.4 0 0 1 5 12Z"/><path d="M12 4.5c1.9 0 3.5.65 4.8 1.9l3.6-3.6A12 12 0 0 0 12 0 12 12 0 0 0 1.1 6.1l4.3 3.3A7.4 7.4 0 0 1 12 4.5Z"/></svg>
          Google
        </button>
        <button class="btn btn-secondary social-btn" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.9 10.9c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.4-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C17 4.6 18 4.9 18 4.9c.6 1.6.2 2.8.1 3.1.7.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>
          GitHub
        </button>
        <button class="btn btn-secondary social-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="15" rx="5.5" ry="4.5"/><circle cx="6.5" cy="9.5" r="1.5"/><circle cx="11" cy="7" r="1.5"/><circle cx="15.5" cy="9.5" r="1.5"/><path d="M7.2 12.6c.4.9 1.5 1.4 4.8 1.4s4.4-.5 4.8-1.4"/></svg>
          LinuxDO
        </button>
        <button class="btn btn-secondary social-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 4C5.9 4 3 6.5 3 9.6c0 1.8 1 3.4 2.5 4.4L5 16.5l2.7-1.4c.6.1 1.2.2 1.8.2"/><path d="M21 14.2c0-2.9-2.6-5.2-5.8-5.2s-5.8 2.3-5.8 5.2 2.6 5.2 5.8 5.2c.6 0 1.2-.1 1.8-.2l2.7 1.4-.5-2.6c1.2-.9 1.8-2.3 1.8-3.8Z"/><circle cx="10.5" cy="9.2" r="0.6" fill="currentColor"/><circle cx="15" cy="9.2" r="0.6" fill="currentColor"/><circle cx="13" cy="14.4" r="0.6" fill="currentColor"/><circle cx="17" cy="14.4" r="0.6" fill="currentColor"/></svg>
          微信
        </button>
        <button class="btn btn-secondary social-btn wide" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.2 3.8 9.1c-.9.3-.8 1.6.1 1.8l6.1 1.3-1.5 6.4c-.2.8.7 1.4 1.3.8l3.5-3.6 4.8 2.8c.7.4 1.6-.1 1.6-.9L22 4.1c.1-.8-.7-1.3-1.5-.9Z"/></svg>
          钉钉
        </button>
      </div>

      <p class="register-hint">还没有账号？<a href="#">立即注册 →</a></p>
    </section>
  </main>

<script>
  (function () {
    'use strict';
    var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';

    /* 主题：与基座脚本共用 localStorage key 'demo-theme' */
    var btn = document.getElementById('themeToggle');
    function sync() {
      btn.innerHTML = document.documentElement.classList.contains('dark') ? SUN : MOON;
    }
    sync();
    btn.addEventListener('click', function () {
      var dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('demo-theme', dark ? 'dark' : 'light'); } catch (e) {}
      sync();
    });

    /* 记住我 */
    document.getElementById('rememberBtn').addEventListener('click', function () {
      document.getElementById('rememberBox').classList.toggle('checked');
    });

    /* 登录（demo：仅阻止提交） */
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
    });
  })();
</script>
</body>
</html>
